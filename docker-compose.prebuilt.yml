# Libredesk from a binary built on the host (includes the Telegram channel), for when
# Docker can't download build dependencies. Build ./bin/libredesk first (see TELEGRAM.md), then:
#   docker compose -f docker-compose.prebuilt.yml up -d
# Secrets live in .env (system user password) and config.toml (encryption key), both git-ignored.
name: libredesk

services:
  app:
    image: alpine:3.21
    working_dir: /libredesk
    container_name: libredesk_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # Sets the System user's password on the first install.
      LIBREDESK_SYSTEM_USER_PASSWORD: ${LIBREDESK_SYSTEM_USER_PASSWORD:-}
    networks:
      - libredesk
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./bin/libredesk:/libredesk/libredesk:ro
      - ./uploads:/libredesk/uploads:rw
      - ./config.toml:/libredesk/config.toml:ro
    command: [sh, -c, "./libredesk --install --idempotent-install --yes --config /libredesk/config.toml && ./libredesk --upgrade --yes --config /libredesk/config.toml && ./libredesk --config /libredesk/config.toml"]

  db:
    image: postgres:17-alpine
    container_name: libredesk_db
    restart: unless-stopped
    networks:
      - libredesk
    # Not published on the host: port 5432 may already be taken by a local Postgres.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libredesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libredesk}
      POSTGRES_DB: ${POSTGRES_DB:-libredesk}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libredesk} -d ${POSTGRES_DB:-libredesk}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: libredesk_redis
    restart: unless-stopped
    networks:
      - libredesk
    volumes:
      - redis-data:/data

networks:
  libredesk:

volumes:
  postgres-data:
  redis-data:
